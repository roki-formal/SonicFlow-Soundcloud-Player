name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Package Release Assets
        run: |
          mkdir -p release
          # If pre-packaged release assets are tracked or build them
          if [ -d "release" ] && [ -f "release/SonicFlow-Windows-x64.zip" ]; then
            echo "Pre-built release assets present"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SonicFlow Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release/*
            SonicFlow.ipa
            sonicflow-*-x86_64.pkg.tar.zst
            SonicFlow.exe
            PKGBUILD
